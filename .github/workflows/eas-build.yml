name: EAS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install
        working-directory: artifacts/khrono

      - name: Fix gradlew permissions
        run: chmod +x artifacts/khrono/android/gradlew

      - name: Build APK
        run: ./gradlew assembleRelease
        working-directory: artifacts/khrono/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-preview
          path: artifacts/khrono/android/app/build/outputs/apk/release/app-release.apk

